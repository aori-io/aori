[package]
name = "aori-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aori"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
dotenv = "0.15"

# Solana - Using anchor-client which pulls in the right solana versions
anchor-client = { version = "0.31.1", features = ["async"] }
anchor-lang = "0.31.1"

# EVM (optional - uncomment when needed)
# alloy = { version = "0.10", features = ["full", "node-bindings", "rpc-types"] }
# ethers = "2.0"  # Alternative: mature and stable

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bs58 = "0.5"

# Async
tokio = { version = "1", features = ["full"] }

# Utils
hex = "0.4"
dirs = "5.0"

# Pin older versions to avoid edition2024 requirement
blake3 = "1.5"
time = "0.3.36"

[workspace]
